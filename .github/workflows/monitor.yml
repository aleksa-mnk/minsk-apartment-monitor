name: Apartment monitor

on:
  schedule:
    # Every 30 minutes, shifted off the top of the hour.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [minsk_scan]

permissions:
  contents: write

concurrency:
  group: minsk-apartment-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Python 3.12 and pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore OSM and walking-route cache
        uses: actions/cache/restore@v4
        with:
          path: data/apartments.sqlite3
          key: minsk-rent-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            minsk-rent-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check listings and notify on Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: data/apartments.sqlite3
          TELEGRAM_WEBHOOK_MODE: '1'
          FORCE_SEARCH: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
        run: python scheduled_check.py

      - name: Persist seen listings and filters in private repository
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist apartment monitor state [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save refreshed OSM and walking-route cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/apartments.sqlite3
          key: minsk-rent-db-${{ github.run_id }}-${{ github.run_attempt }}
